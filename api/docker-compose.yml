services:

  # ── Reverse proxy ─────────────────────────────────────────────────────────────
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - landing
      - editor
    networks:
      - blueprint

  # ── API server ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-prod
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      BLUEPRINT_DB_HOST: ${BLUEPRINT_DB_HOST}
      BLUEPRINT_DB_PORT: ${BLUEPRINT_DB_PORT}
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8082/realms/nawaran}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/nawaran/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-dashboard,landing-editor}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/}
      QUEUE_NAME: ${QUEUE_NAME:-provision-website}

    depends_on:
      psql_bp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blueprint

  # ── Background worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-prod
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@rabbitmq:5672/}
      PODMAN_API_URL: ${PODMAN_API_URL}
      CADDY_API_URL: ${CADDY_API_URL:-http://caddy:2019}
      CADDY_SERVER_NAME: ${CADDY_SERVER_NAME:-srv0}
      QUEUE_NAME: ${QUEUE_NAME:-provision-website}
    depends_on:
      rabbitmq:
        condition: service_healthy
      caddy:
        condition: service_started
    networks:
      - blueprint

  # ── Landing server ────────────────────────────────────────────────────────────
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      target: landing-prod
    restart: unless-stopped
    environment:
      API_URL: http://api:${PORT:-8080}
      STATIC_DIR: /app/static
      LANDING_CACHE_DIR: /app/cache
      LANDING_PORT: ${LANDING_PORT:-8081}
      LANDING_WEBSITE_ID: ${LANDING_WEBSITE_ID:-}
      LANDING_API_TIMEOUT_MS: ${LANDING_API_TIMEOUT_MS:-1500}
    volumes:
      - landing_cache:/app/cache
    depends_on:
      - api
    networks:
      - blueprint

  # ── Editor server ─────────────────────────────────────────────────────────────
  editor:
    build:
      context: .
      dockerfile: Dockerfile
      target: editor-prod
    restart: unless-stopped
    environment:
      API_URL: http://api:${PORT:-8080}
      STATIC_DIR: /app/static
      LANDING_CACHE_DIR: /app/cache
      EDITOR_PORT: ${EDITOR_PORT:-8082}
      EDITOR_WEBSITE_ID: ${EDITOR_WEBSITE_ID:-}
      EDITOR_API_TIMEOUT_MS: ${EDITOR_API_TIMEOUT_MS:-1500}
    volumes:
      - editor_cache:/app/cache
    depends_on:
      - api
    networks:
      - blueprint

  # ── PostgreSQL (app) ──────────────────────────────────────────────────────────
  psql_bp:
    image: postgres:17.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
    ports:
      - "${BLUEPRINT_DB_PORT:-5432}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -U ${BLUEPRINT_DB_USERNAME} -d ${BLUEPRINT_DB_DATABASE}'"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - blueprint

  # ── Keycloak DB ───────────────────────────────────────────────────────────────
  keycloak_db:
    image: postgres:17.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}'"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - blueprint

  # ── Keycloak ──────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-nawaran.json:/opt/keycloak/data/import/realm-nawaran.json:ro
    depends_on:
      keycloak_db:
        condition: service_healthy

    networks:
      - blueprint

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "-q"
        - "ping"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blueprint

volumes:
  psql_volume_bp:
  landing_cache:
  editor_cache:
  keycloak_db_data:
  caddy_data:
  caddy_config:
  rabbitmq_data:

networks:
  blueprint: